<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="tomGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8A80" />
      <stop offset="35%" stop-color="#FF5252" />
      <stop offset="75%" stop-color="#D50000" />
      <stop offset="100%" stop-color="#880E4F" />
    </radialGradient>
    <filter id="tomShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#FBFDFB" />

