# ==============================================================================
# RENDER.COM BLUEPRINT: VFT FARMS BACKEND (FREE WEB SERVICE)
# ==============================================================================
services:
  - type: web
    name: vftfarms-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # Paste your Supabase or Neon.tech connection string here
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
